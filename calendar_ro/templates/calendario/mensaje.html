{% load static %} {% include '../plantillas/menu_bar.html'%}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.12.1/css/all.min.css" integrity="sha256-mmgLkCYLUQbXn0B1SRqzHar6dCnv9oZFPEC1g1cwlkk=">
    <link rel="stylesheet" href="{% static 'css/interfazu.css' %}">
{% block header%} {% endblock %}
<body>
    {% block sidebar %} {% endblock %}
    <div class="container-fluid">
        <div class="row ">
            
                
            <div class="col-xl-6 col-lg-6">
                <div class="card l-bg-blue-dark">
                    <div class="card-statistic-3 p-4">
                        <div class="card-icon card-icon-large"><i class="fas fa-users"></i></div>
                        <div class="mb-4">
                           
                        </div>
                        <div class="row align-items-center mb-2 d-flex">
                            <div class="col-8">
                                <h2 class="d-flex align-items-center mb-0">
                                    {{sistema}}
                                </h2>
                            </div>
                            <div class="col-4 text-right">
                                
                            </div>
                        </div>
                        <div class="progress mt-1 " data-height="8" style="height: 8px;">
                            <div class="progress-bar l-bg-green" role="progressbar" data-width="25%" aria-valuenow="25" aria-valuemin="0" aria-valuemax="100" style="width: 25%;"></div>
                            
                    </div>
                    <div class="row">
                        <div class="col-lg-4 col-md-6 col-12 mt-4 pt-2">
                            <div class="card border-0 bg-light rounded shadow">
                                <div class="card-body p-4">
                                    
                                    <h5>Aviso!!</h5>
                                

                                    <div class="mt-3">
                                    {{aviso}}        
                                    </div>
                                    <a href="{% url 'nuevo_evento' %}">
                                        <button class="btn btn-primary" >Agrega Otro</button>
                                    </a>
                                </div>
                            </div>
                        </div><!--end col-->
                </div>
            </div>
            
            
        </div>
    </div>
</body>
</html>

{% block footer %} {% endblock %}
